 BYG_wang_chengbin: "왕청빈"
 BYG_wu_peifu: "우페이푸"
 BYG_wu_peifu_army_chief_desc: "출생 : 1874년 4월 22일, 대청국 산둥성\n\n우페이푸는 어린 시절 유학 교육을 받았으나 이후 1902년 바오딩 군관학교에 입학하여 직업 군인이 되었고, 졸업 후 장교로서의 군재를 인정받아 빠르게 승진하였습니다. 그는 북양군에 입대하여 차오쿤 휘하에서 차오쿤의 신임을 받았고, 포병대 대대장에 임명되어 신해혁명, 장훈복벽 진압 등에 참전하였고, 공을 세워 2인자 자리에 오를 만큼 승진하였습니다.\n\n1919년 제3사단 사단장이 된 그는 1920년 이계와의 전쟁 발발 당시 돤치루이가 초기 진압에 실패하자 난징 앞에서 지연전을 실시하여 적의 군세를 둔화시켰고, 강 너머로 들어온 적군을 완전히 섬멸하였습니다. 그는 북부 전선을 장강과 우창 부근으로 줄이는데 성공한 공으로 총사령관이 되었습니다.\n\n1931년 이계인들의 공세가 줄어들자 그는 후베이와 안후이성의 재건에 힘쓰며 전선에서 공을 세웠던 이들을 자신의 휘하에 두었습니다. 이들은 우페이푸가 영도하는 뤄양파의 핵심 세력이 되었습니다. 또한 적의 세력이 감소하는걸 확인한 우페이푸는 가짜전쟁 기간동안 공세를 준비하였습니다.\n\n1945년, 우페이푸는 공세 명령을 내렸습니다. 이계인들의 군대는 중과부적으로 무너지기 시작했고 결국 전선을 뚫어내었습니다. 결국 광저우를 시작으로 우한 등을 탈환했고 1949년 난징에서 완전히 이계인들이 축출되었으며, 이제 상하이를 목전에 두고 있습니다.\n\n모든 이들이 우페이푸가 차기 대총통이 될거라 예상했지만, 1936년 우페이푸는 자신이 정치에 관여하지 않겠다는 성명과 종전 후 퇴역하겠다는 충격적인 선언을 하였습니다. 현재 전쟁은 막바지로 나아가고 있으며, 노령인 그는 은퇴 일정을 잡고 있습니다."

