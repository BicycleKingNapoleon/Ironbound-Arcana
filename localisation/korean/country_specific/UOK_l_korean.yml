l_korean:
 UOK_leona_blaze: "레오나 블레이즈"
 UOK_leona_blaze_desc: "레오나 블레이즈는 기사단령이 낳은 새로운 세대의 칼 입니다.\n\n그녀는 기사단의 기동성과 즉흥성, 지구인 장교들의 보병전과 병참 감각을 하나의 교리로 묶으려 합니다.\n\n아직 완성된 명장은 아닙니다."

 UOK_carmen_valcarcel: "카르멘 발카르셀"
 UOK_carmen_valcarcel_desc: "원탁의 전통파 기수이자 레오나와 같은 별들의 세대에 속한 카르멘 발카르셀은, 신세계의 전술이 기사단의 답이라고 믿지 않았습니다.\n\n새로운 군대들은 기사단이 적에게 다가설 시간을 벌어주면 충분했습니다. 보병은 적을 붙잡고, 포병은 적의 눈을 가리며, 보급선은 기사단이 쓰러지지 않을 만큼만 이어지면 됩니다.\n\n결정적인 순간, 전장을 끝내는 것은 여전히 기사단의 돌격이어야 했습니다. 칼리는 기사단이 가장 잘하던 것을 잊지 말아야 한다고 믿었습니다.\n\n두려움이 생기기 전에 적의 심장부에 닿는 것.\n그녀는 근대전은 기사단의 종말이 아닌 기사단이 도달해야 할 거리를 조금 더 멀게 만들었을 뿐이라고 생각했습니다."
